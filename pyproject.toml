[project]
name = "othello-bot"
version = "0.1.0"
description = "Discord で遊べるオセロ Bot"
readme = "README.md"
authors = [
    { name = "drago-suzuki58", email = "dorasuzu58@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "pillow>=12.3.0",
]

[project.scripts]
othello-bot = "othello_bot:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
